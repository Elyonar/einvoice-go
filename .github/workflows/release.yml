name: Release

on:
  push:
    branches: [main]
    paths:
      - 'version.go'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: pkg
        run: echo "version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' version.go | head -1)" >> "$GITHUB_OUTPUT"

      - name: Check if the tag already exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already released
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Tag v${{ steps.pkg.outputs.version }} already exists. Skipping release."

      - uses: actions/setup-go@v5
        if: steps.tag_check.outputs.exists == 'false'
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        if: steps.tag_check.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Lint, build, test, sync-check, guides-check
        if: steps.tag_check.outputs.exists == 'false'
        run: make lint && go build ./... && go vet ./examples/... && make test sync-check guides-check

      # A Go module is published by its tag: pkg.go.dev and the module proxy read the repository.
      - name: Create git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.pkg.outputs.version }}" -m "Release v${{ steps.pkg.outputs.version }}"
          git push origin "v${{ steps.pkg.outputs.version }}"

      - name: Extract changelog for this version
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          awk "/^## ${VERSION}/,/^## [0-9]/" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release v${VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: true

      # Asks the public proxy for the new version so pkg.go.dev indexes it without waiting for a first `go get`.
      - name: Warm the module proxy
        if: steps.tag_check.outputs.exists == 'false'
        run: GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m github.com/elyonar/einvoice-go@v${{ steps.pkg.outputs.version }} || true
