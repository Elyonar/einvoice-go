name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23", "stable"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Lint
        run: make lint

      - name: Build (examples included)
        run: go build ./... && go vet ./examples/...

      - name: Test
        run: make test

      - name: Guides are current
        run: make guides-check

  sync-check:
    # The models, snapshot and vectors must be what the pinned einvoice-js commit generates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot, vectors and generated models match einvoice-js
        # einvoice-js is private: without a token that may read it the check is skipped with a notice
        # (the fallback agreed with the owner); it then runs locally before a release (PUBLISHING.md).
        env:
          EINVOICE_JS_TOKEN: ${{ secrets.EINVOICE_JS_TOKEN }}
        run: |
          if [ -z "$EINVOICE_JS_TOKEN" ]; then
            echo "::notice title=sync-check skipped::einvoice-js is private and no EINVOICE_JS_TOKEN secret is set. Run make sync-check locally before a release, with EINVOICE_JS_DIR set to your einvoice-js checkout (any folder name)."
            exit 0
          fi
          make sync-check
